server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - Authentication

        - id: policy-service
          uri: lb://policy-service
          predicates:
            - Path=/api/v1/policies/**
          filters:
            - Authentication

        - id: claims-service
          uri: lb://claims-service
          predicates:
            - Path=/api/v1/claims/**
          filters:
            - Authentication

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.insurance: DEBUG
    org.springframework.cloud.gateway: DEBUG

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000